apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infra-mysql

resources:
  - ../../base

# Generate secret from env file (not committed to git)
secretGenerator:
  - name: mysql
    type: Opaque
    envs:
      - mysql-secret.env
    options:
      disableNameSuffixHash: true

# You can add local-specific configurations here
# For example, different resource limits, storage size, etc.
